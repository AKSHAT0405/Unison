{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <title>{% block title %} Unisonary {% endblock %}</title>
  </head>
  <body>
    <nav class="navbar md:navbar-expand bg-1">
      <div class="container-fluid">
        <a href="{% url 'unis_list' %}" class="navbar-brand" href="#"
          >Unison</a
        >
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarDrawer"
          aria-controls="navbarDrawer"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarDrawer"
          aria-labelledby="navbarDrawerLabel"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body mb-2 md:mb-0">
            <form class="hstack gap-2" role="search" method="get" action="{% url 'unis_list' %}">
              <input
                style="max-width: 500px; "
                class="form-control"
                type="search"
                placeholder="Search"
                aria-label="Search"
                name = "q"
                value="{{ request.GET.q }}"
              />
              <button class="btn-solid btn-icon theme-secondary" type="submit">
                <i class="bi bi-search"></i>
              </button>
            </form>
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button class="btn-solid" type="submit">logout</button>
            </form>
            {% else %}
            <a href="{% url 'register' %}" class="btn btn-primary mx-2">
              Register
            </a>
            <a href="{% url 'login' %}" class="btn btn-primary mx-2">
              Login
            </a>
            {% endif %}
          </div>
        </dialog>
      </div>
    </nav>
    <div class="container">
    {% block content %}
     Unisonary is a platform for sharing and discovering unis.
    {% endblock %}
    </div>
  </body>
</html>
